name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC
  workflow_dispatch:       # também pode ser executado manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar perfil e dados do site com dados atuais do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commitar apenas se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/profile.svg docs; then
            echo "Sem mudanças no perfil."
          else
            git add assets/profile.svg docs
            git commit -m "Atualiza perfil automaticamente"
            git push
          fi
