<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fernando Pereira — Software Engineering × Product Design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FB"/>
      <stop offset="1" stop-color="#E6ECF7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1769FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1769FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- Monograma -->
  <g transform="translate(820 58)">
    <rect width="300" height="204" rx="28" fill="#FFFFFF" stroke="#D5DEEE" stroke-width="2"/>
    <text x="150" y="132" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" fill="url(#accent)">FP</text>
    <rect x="96" y="158" width="108" height="6" rx="3" fill="url(#accent)"/>
    <text x="150" y="190" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#5B6B86">SOFTWARE × DESIGN</text>
  </g>

  <!-- Texto -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="20" font-weight="700" letter-spacing="4" fill="#1769FF">PORTFÓLIO</text>
    <text x="72" y="184" font-size="76" font-weight="800" letter-spacing="-2" fill="#0F1B33">Fernando Pereira</text>
    <text x="72" y="232" font-size="26" font-weight="500" fill="#33445F">Software Engineering × Product Design</text>
    <text x="72" y="272" font-size="19" fill="#5B6B86">Transformando ideias em interfaces que funcionam, comunicam e fazem sentido.</text>
  </g>
</svg>
